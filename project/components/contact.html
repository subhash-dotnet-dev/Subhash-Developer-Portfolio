<!-- Contact component -->
<section class="section" id="contact" aria-label="Contact">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-label">Contact</span>
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">Let's discuss opportunities, collaborations, or projects.</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info reveal">
        <div class="contact-info-card">
          <div class="contact-info-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div>
            <div class="contact-info-label">Email</div>
            <a href="mailto:subhash.yadav.dev@gmail.com" class="contact-info-value">subhash.yadav.dev@gmail.com</a>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="contact-info-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div>
            <div class="contact-info-label">Location</div>
            <div class="contact-info-value">India</div>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="contact-info-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div>
            <div class="contact-info-label">Status</div>
            <div class="contact-info-value">Available for Opportunities</div>
          </div>
        </div>

        <div class="contact-info-card" style="flex-direction: column; align-items: flex-start; gap: var(--space-2);">
          <div class="contact-info-label" style="margin-bottom: var(--space-1);">Connect</div>
          <div class="social-icons" id="contactSocialIcons"></div>
        </div>
      </div>

      <div class="contact-form reveal reveal-delay-2">
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="contactName">Name <span class="required">*</span></label>
            <input type="text" id="contactName" name="name" class="form-input" placeholder="Your name" autocomplete="name" required />
            <span class="form-error" id="errorName" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="contactEmail">Email <span class="required">*</span></label>
            <input type="email" id="contactEmail" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
            <span class="form-error" id="errorEmail" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="contactSubject">Subject <span class="required">*</span></label>
            <input type="text" id="contactSubject" name="subject" class="form-input" placeholder="What is this about?" required />
            <span class="form-error" id="errorSubject" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="contactMessage">Message <span class="required">*</span></label>
            <textarea id="contactMessage" name="message" class="form-textarea" placeholder="Tell me about your project or opportunity..." required></textarea>
            <span class="form-error" id="errorMessage" aria-live="polite"></span>
          </div>

          <div id="formSuccess" class="form-success" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span>Your email client is opening with your message ready to send.</span>
          </div>

          <button type="submit" class="btn btn-primary" id="contactSubmit" style="width: 100%;">
            <span class="btn-text">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send Message
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
