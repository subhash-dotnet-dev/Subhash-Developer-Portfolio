    document.addEventListener('DOMContentLoaded', () => {
      if (window.socialLinks) {
        const mobileSocial = document.getElementById('mobileMenuSocial');
        const footerSocial = document.getElementById('footerSocialSmall');
        if (mobileSocial) mobileSocial.innerHTML = window.socialLinks.map(s => window.createSocialIconHTML(s)).join('');
        if (footerSocial) footerSocial.innerHTML = window.socialLinks.map(s => window.createSocialIconHTML(s)).join('');
      }
      if (window.renderProjectDetail) window.renderProjectDetail();
      const yearEl = document.getElementById('currentYear');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    });
